name: SSTOCK Whale Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '55 1 * * 1-5'
    - cron: '55 5 * * 1-5'

jobs:
  track-whales:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install websockets
        run: pip install websockets

      - name: Run Whale Bot
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          SSTOCK_COOKIE: ${{ secrets.SSTOCK_COOKIE }}
        run: python -u bot.py
